<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册账号 - NFLSHC Chat</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .redirect-page { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .redirect-icon { font-size: 72px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .redirect-page h1 { font-size: clamp(28px, 5vw, 48px); font-weight: 800; color: var(--gold); margin-bottom: 12px; }
    .redirect-page p { font-size: clamp(14px, 2vw, 18px); color: rgba(255,255,255,0.7); max-width: 480px; line-height: 1.7; margin-bottom: 28px; }
    .redirect-page .btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);
      color: #1a1a2e; font-size: 16px; font-weight: 700;
      padding: 14px 36px; border-radius: 999px; text-decoration: none;
      box-shadow: 0 6px 24px rgba(255,215,0,0.4);
      transition: transform .15s, box-shadow .2s; margin-bottom: 14px;
    }
    .redirect-page .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(255,215,0,0.6); }
    .redirect-page .note { font-size: 13px; color: rgba(255,255,255,0.4); }
    .back-link { margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.45); }
    .back-link a { color: var(--gold-light); text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .loader { width: 48px; height: 48px; border: 4px solid rgba(255,215,0,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .countdown { font-size: 20px; color: var(--gold); font-weight: 700; margin-top: 12px; }
  </style>
  <script>
    // Auto redirect after countdown
    const TARGET = 'https://nflshcchat.cc.cd/register.html';
    let seconds = 3;
    function updateCountdown() {
      var el = document.getElementById('countdown');
      if (el) el.textContent = seconds;
      if (seconds <= 0) {
        window.location.replace(TARGET);
      } else {
        seconds--;
        setTimeout(updateCountdown, 1000);
      }
    }
    window.addEventListener('load', updateCountdown);
  </script>
</head>
<body class="page-register">
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span><span class="blob blob-2"></span>
    <span class="blob blob-3"></span><span class="blob blob-4"></span><span class="blob blob-5"></span>
    <span class="raster"></span>
  </div>

  <div class="redirect-page">
    <div class="loader"></div>
    <div class="redirect-icon">💬</div>
    <h1>注册 NFLSHC Chat 账号</h1>
    <p>即将跳转到官方注册页面。NFLSHC Chat 账号完全免费，支持 GitHub Issues 驱动的零服务器注册。</p>
    <a class="btn" href="https://nflshcchat.cc.cd/register.html" target="_blank">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93z"/></svg>
      立即跳转
    </a>
    <p class="note">（或等待 <span id="countdown">3</span> 秒后自动跳转）</p>
    <p class="note">目标：https://nflshcchat.cc.cd/register.html</p>
    <div class="back-link">
      <a href="index.html">← 返回首页</a> ·
      <a href="windows.html">Windows 下载</a> ·
      <a href="android.html">Android 下载</a>
    </div>
  </div>
</body>
</html>
